services:
  - type: web
    name: dse-web-scrapper
    runtime: node
    plan: free
    # --include=dev ensures build-only devDependencies (typescript, tailwind, …)
    # are installed even when Render sets NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
